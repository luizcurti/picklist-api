name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" on main re-runs the pipeline and deploys, e.g. to recreate
  # the stack after the Destroy workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy (it could leave a Terraform state
  # lock behind).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    # Required to run the test suite — reachable at localhost:5432 from
    # every step below (the job runs on the runner, not in a container).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: picklist
          POSTGRES_USER: picklist
          POSTGRES_PASSWORD: picklist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U picklist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install packages
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run eslint

      - name: 🎨 Check formatting
        run: npm run format:check

      - name: 🧪 Run Jest tests
        run: npm test

      - name: 🏗️ Build project
        run: npm run build

      # Production dependencies only — dev-only advisories don't block.
      - name: 🔒 Security audit
        run: npm audit --omit=dev --audit-level moderate || echo "⚠️ Dev dependencies have known vulnerabilities"

      - name: 🐳 Build Docker image
        run: docker build -t picklist-api:ci .

      # SHA-pinned, not a version tag — trivy-action had 76/77 tags hijacked
      # to credential-stealing malware in March 2026 (GHSA-69fq-xp46-6x23).
      - name: 🛡️ Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, released 2026-04-22, after the incident was fully remediated
        with:
          image-ref: picklist-api:ci
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      # --network host so the container reaches postgres at localhost:5432,
      # same as the default DATABASE_URL everywhere else.
      - name: 🚀 Run e2e tests against the container
        run: |
          docker run -d --name picklist-api-ci --network host -e API_KEYS=dev-local-key picklist-api:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3005/health > /dev/null; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for container to become healthy... ($i)"
            sleep 2
          done
          npm run test:e2e
          docker stop picklist-api-ci
          docker rm picklist-api-ci

      # Skips "Picks" — that flow needs RabbitMQ, kept out of CI on purpose
      # (see README: more services means more flake surface). Run via npx,
      # not an installed devDependency — newman's own tree pulls in
      # unrelated advisories that would show up in this project's own audit.
      - name: 📮 Run Postman collection (newman)
        run: |
          docker run -d --name picklist-api-postman --network host -e API_KEYS=dev-local-key picklist-api:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3005/health > /dev/null; then
              echo "Container is healthy"
              break
            fi
            echo "Waiting for container to become healthy... ($i)"
            sleep 2
          done
          npx --yes newman@6 run picklist-api.postman_collection.json \
            --env-var apiKey=dev-local-key \
            --folder Products \
            --folder Cleanup \
            --reporters cli
          docker stop picklist-api-postman
          docker rm picklist-api-postman

      - name: 📤 Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  infra:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: ✅ infra/
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: ✅ bootstrap/
        working-directory: bootstrap
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Deploys to real AWS on every push to main (or a manual run on main), once
  # the checks pass. Auth is GitHub OIDC -> IAM role (bootstrap/), so no AWS
  # keys are stored in GitHub. Configuration lives in the `production` GitHub
  # environment (docs/deployment.md); until AWS_DEPLOY_ROLE_ARN is set there,
  # the job skips the AWS steps and stays green.
  deploy:
    name: Deploy to AWS
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [ci, infra]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_app_image_tag: ${{ github.sha }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: 🔎 Check deploy configuration
        id: config
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice title=Deploy skipped::AWS_DEPLOY_ROLE_ARN is not set in the production environment. Run scripts/bootstrap.sh (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -z "$AWS_REGION" ] && missing="$missing AWS_REGION"
          [ -z "$STATE_BUCKET" ] && missing="$missing TF_STATE_BUCKET"
          if [ -n "$missing" ]; then
            echo "::error title=Deploy misconfigured::Missing in the production environment:$missing"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: 📥 Checkout
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔐 Configure AWS credentials (OIDC)
        if: steps.config.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: 🔧 Setup Terraform
        if: steps.config.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The S3 backend is only added here, at deploy time, so local runs keep
      # local state.
      - name: 🗄️ Terraform init (S3 remote state)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          cat > ci_backend.tf <<'EOF'
          terraform {
            backend "s3" {}
          }
          EOF
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=picklist-api/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      # The ECS services need the image to exist, so the registry comes first
      # (a no-op after the first deploy), then the image is pushed, then the
      # rest of the stack is applied.
      - name: 📦 Terraform apply (ECR repository)
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color -auto-approve -target=aws_ecr_repository.app 2>&1 | tee ecr.log

      - name: 🐳 Build and push the image
        if: steps.config.outputs.enabled == 'true'
        run: |
          REPO=$(terraform -chdir=infra output -raw ecr_repository_url)
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"

      - name: 📝 Terraform plan
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.log

      - name: 🚀 Terraform apply
        if: steps.config.outputs.enabled == 'true'
        working-directory: infra
        shell: bash
        run: terraform apply -input=false -no-color tfplan 2>&1 | tee apply.log

      # Surface each Terraform "Error:" block as a run annotation, so failures
      # are readable from the run summary without downloading the raw log.
      - name: 🧾 Report Terraform errors
        if: failure() && steps.config.outputs.enabled == 'true'
        working-directory: infra
        run: |
          for f in ecr.log plan.log apply.log; do
            [ -f "$f" ] || continue
            awk '{ gsub(/%/, "%25") }
                 /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
                 buf && n < 15 { buf = buf "%0A" $0; n++ }
                 END { if (buf) print buf }' "$f" |
              while IFS= read -r block; do echo "::error title=Terraform ($f)::${block}"; done
          done

      - name: ⏳ Wait for the ECS services
        if: steps.config.outputs.enabled == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$(terraform -chdir=infra output -raw ecs_cluster)" \
            --services $(terraform -chdir=infra output -json ecs_services | jq -r '.[]')

      - name: 🧪 Smoke tests (real AWS)
        if: steps.config.outputs.enabled == 'true'
        run: |
          API=$(terraform -chdir=infra output -raw api_url)
          KEY=$(aws ssm get-parameter --with-decryption \
            --name "$(terraform -chdir=infra output -raw api_key_parameter)" \
            --query Parameter.Value --output text)
          echo "::add-mask::$KEY"
          API_KEY="$KEY" API_URL="$API" scripts/smoke-test.sh
          {
            echo "### Deployed :rocket:"
            echo "API: ${API}/api/v1 (header X-API-Key, stored in SSM: $(terraform -chdir=infra output -raw api_key_parameter))"
            echo
            echo "OpenAPI docs: ${API}/docs"
          } >> "$GITHUB_STEP_SUMMARY"
